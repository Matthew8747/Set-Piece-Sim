# fly.toml app configuration file generated for restart-lab-api on 2026-07-17T17:43:58+01:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'restart-lab-api'
primary_region = 'lhr'

[build]
  dockerfile = 'apps/backend/Dockerfile'

[env]
  RESTART_APP_ENV = 'prod'
  RESTART_CORS_ORIGINS = '["http://localhost:3000"]'
  RESTART_DEBUG = 'false'
  # Scenarios and sim-runs live on the mounted volume, NOT in the image.
  # Absolute on purpose, and deliberately not /app/data: the squad/xG marts are
  # baked in at /app/data/marts, so mounting a volume over /app/data would hide
  # them and empty out /scenarios.
  RESTART_DATA_DIR = '/data'

# Durable store for scenarios + sim runs. Without this the SQLite file lives on
# the machine's ephemeral disk, so every scenario you create is destroyed the
# next time the machine stops - which with auto_stop_machines is whenever the
# app goes idle. The symptom is a 404 "unknown scenario" on a scenario the UI
# just showed you.
#
# One-time setup before the next deploy:
#   fly volumes create restart_data --size 1 --region lhr
[mounts]
  source = 'restart_data'
  destination = '/data'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/healthz'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '1gb'
